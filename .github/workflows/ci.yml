name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: gofmt -l . | (! grep .)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/seedflux
  sqlite-fixture:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: sqlite3 fixture.db < fixtures/sqlite/ecommerce.sql
      - run: go run ./cmd/seedflux generate --config fixtures/seedflux.yml --url fixture.db
      - run: go run ./cmd/seedflux validate --config fixtures/seedflux.yml --url fixture.db
